name: Validate Specs

on:
  push:
    paths:
      - ".github/workflows/validate-specs.yml"
      - "schema/**"
      - "examples/**"
  pull_request:
    paths:
      - ".github/workflows/validate-specs.yml"
      - "schema/**"
      - "examples/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema PyYAML

      - name: Validate trace-return.sample.yml
        run: |
          python - <<'PY'
          import json
          import yaml
          from jsonschema import Draft202012Validator

          schema_path = "schema/trace-return-v0.1.schema.json"
          instance_path = "examples/trace-return.sample.yml"

          with open(schema_path, "r", encoding="utf-8") as f:
              schema = json.load(f)

          with open(instance_path, "r", encoding="utf-8") as f:
              instance = yaml.safe_load(f)

          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(instance)

          print(f"OK: {instance_path} is valid against {schema_path}")
          PY

      - name: Validate monthly-report.sample.yml
        run: |
          python - <<'PY'
          import json
          import yaml
          from jsonschema import Draft202012Validator

          schema_path = "schema/monthly-report-v0.1.schema.json"
          instance_path = "examples/monthly-report.sample.yml"

          with open(schema_path, "r", encoding="utf-8") as f:
              schema = json.load(f)

          with open(instance_path, "r", encoding="utf-8") as f:
              instance = yaml.safe_load(f)

          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(instance)

          print(f"OK: {instance_path} is valid against {schema_path}")
          PY
